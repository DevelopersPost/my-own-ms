services:
  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: [ "CMD-SHELL", "nc -z kafka 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    extends:
      file: common-config.yml
      service: network-deploy-service

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: keycloak
    ports:
      - "127.0.0.1:7080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
    command: "start-dev"
    extends:
      file: common-config.yml
      service: network-deploy-service

  xappdb:
    container_name: xappdb
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: xappdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  yappdb:
    container_name: yappdb
    ports:
      - 3307:3306
    environment:
      MYSQL_DATABASE: yappdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  zappdb:
    container_name: zappdb
    ports:
      - 3308:3306
    environment:
      MYSQL_DATABASE: zappdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  configserver:
    image: "rajeev199/configserver:s4"
    container_name: configserver
    ports:
      - "8071:8071"
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      service: network-deploy-service
      file: common-config.yml

  eurekaserver:
    image: "rajeev199/eurekaserver:s4"
    container_name: eurekaserver
    ports:
      - "8070:8070"
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: eurekaserver
    extends:
      service: microservice-configserver-config
      file: common-config.yml

  x-app:
    image: "rajeev199/x-app:s4"
    container_name: x-app
    depends_on:
      configserver:
        condition: service_healthy
      xappdb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: x-app
      SPRING_DATASOURCE_URL: "jdbc:mysql://xappdb:3306/xappdb"
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: "kafka:9092"
    extends:
      service: microservice-eureka-config
      file: common-config.yml

  y-app:
    image: "rajeev199/y-app:s4"
    container_name: y-app
    depends_on:
      configserver:
        condition: service_healthy
      yappdb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "y-app"
      SPRING_DATASOURCE_URL: "jdbc:mysql://yappdb:3306/yappdb"
    extends:
      service: microservice-eureka-config
      file: common-config.yml

  z-app:
    image: "rajeev199/z-app:s4"
    container_name: z-app
    depends_on:
      configserver:
        condition: service_healthy
      zappdb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8082/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "z-app"
      SPRING_DATASOURCE_URL: "jdbc:mysql://zappdb:3306/zappdb"
    extends:
      service: microservice-eureka-config
      file: common-config.yml

  message:
    image: "rajeev199/message:s4"
    container_name: message-ms
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: "kafka:9092"
    extends:
      file: common-config.yml
      service: network-deploy-service

  edgeserver:
    image: "rajeev199/edgeserver:s4"
    container_name: edgeserver
    ports:
      - "8072:8072"
    depends_on:
      x-app:
        condition: service_healthy
      y-app:
        condition: service_healthy
      z-app:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: edgeserver
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: "http://keycloak:8080/realms/master/protocol/openid-connect/certs"
    extends:
      service: microservice-eureka-config
      file: common-config.yml


networks:
  rajnet:
    driver: "bridge"
